<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13121b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes finances</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#13121b;--card:#1c1b27;--card2:#232232;--soft:#2a2939;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--tx:#f4f2fb;--tx2:#aeabc2;--tx3:#7c7992;
--lav:#b9a8ff;--mint:#8ee6c4;--peach:#ffb98f;--pink:#ff9fc8;--sky:#8fcbff;--butter:#ffe28f;--bad:#ff8fa3;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 8% -10%,rgba(185,168,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(255,159,200,.10),transparent 60%),var(--bg);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
header h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
header h1 span{background:linear-gradient(90deg,var(--lav),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--tx2);border:1px solid var(--line)}
.ib svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(140deg,rgba(185,168,255,.22),rgba(255,159,200,.12) 60%,rgba(143,203,255,.08)),var(--card);border-color:var(--line2)}
.lbl{color:var(--tx2);font-size:13px;font-weight:500}
.big{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:4px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500;background:var(--soft)}
.up{color:var(--mint)}.down{color:var(--bad)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pill{background:var(--card2);border-radius:16px;padding:10px 11px;min-width:0}.pill .lbl{font-size:12px;white-space:nowrap}
.pill b{display:block;font-size:16px;font-weight:600;margin-top:2px}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
h2{font-size:16px;font-weight:600;margin:0 0 12px}
.op{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.op .t{flex:1;min-width:0}.op .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.op .t small{color:var(--tx3);font-size:12.5px}
.op .m{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:6px}.bar>div{height:100%;border-radius:8px}
.cat{margin-bottom:12px}
.empty{color:var(--tx3);text-align:center;padding:18px 6px;font-size:14px}
.tip{background:rgba(255,226,143,.10);border:1px solid rgba(255,226,143,.25);color:var(--butter);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.day{color:var(--tx3);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 4px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav b{font-size:17px;font-weight:600;text-transform:capitalize}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
nav .in{max-width:420px;margin:0 auto;background:rgba(35,34,50,.92);border:1px solid var(--line2);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx3);font-size:11px;letter-spacing:-.01em;font-weight:500}
nav button.t svg{width:22px;height:22px}
nav button.t.on{color:var(--lav)}
.plus{width:60px;height:60px;border-radius:20px;margin:-26px auto 0;background:linear-gradient(140deg,var(--lav),var(--pink));color:#1a1626;display:grid;place-items:center;box-shadow:0 8px 24px rgba(185,168,255,.45)}
.plus svg{width:28px;height:28px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(8,7,14,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{padding:10px 0;border-radius:12px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--soft);color:var(--tx)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 14px}
.amt input{field-sizing:content;min-width:1.2ch;width:auto;max-width:260px;text-align:center;background:none;border:0;outline:0;font-size:46px;font-weight:600;letter-spacing:-.02em}
.amt input::placeholder{color:var(--tx3)}
.amt span{font-size:30px;color:var(--tx2)}
@supports not (field-sizing:content){.amt input{width:100%}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cats button{background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tx2)}
.cats button em{font-style:normal;font-size:22px}
.cats button.on{border-color:var(--lav);color:var(--tx);background:rgba(185,168,255,.14)}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:13px;color:var(--tx2);margin:0 0 5px 4px}
.f input,.f select{width:100%;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);padding:0 14px;outline:0}
.f input:focus,.f select:focus{border-color:var(--lav)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;height:54px;border-radius:18px;font-weight:600;font-size:16px;background:linear-gradient(140deg,var(--lav),var(--pink));color:#1a1626}
.btn.g{background:var(--soft);color:var(--tx)}
.btn.d{background:rgba(255,143,163,.14);color:var(--bad)}
.btns{display:grid;gap:10px;margin-top:6px}
.sw{font-size:13px;color:var(--tx3);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--soft);border:1px solid var(--line2);padding:10px 18px;border-radius:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--tx2);margin-top:6px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg text{font-family:Outfit,system-ui,sans-serif}
@media(min-width:900px){.wrap{max-width:620px}}
</style>
</head>
<body>
<div class="wrap">
 <header><h1><span>Mes finances</span></h1><span class="lbl" id="hdate"></span></header>
 <main id="main"></main>
</div>
<nav><div class="in">
 <button class="t on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
 <button class="t" data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Opérations</button>
 <button class="plus" id="add" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
 <button class="t" data-tab="analyse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Analyse</button>
 <button class="t" data-tab="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Configuration</button>
</div></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='mesfinances-v1';
const CATS={
 dep:[['courses','Courses','🛒','#8ee6c4'],['resto','Resto','🍽️','#ffb98f'],['logement','Logement','🏠','#b9a8ff'],['transport','Transport','🚗','#8fcbff'],['factures','Factures','💡','#ffe28f'],['sante','Santé','💊','#ff9fc8'],['loisirs','Loisirs','🎮','#c9b8ff'],['shopping','Shopping','🛍️','#ffa9b8'],['abos','Abonnements','📱','#9fd8ff'],['enfants','Enfants','🧸','#ffd3a8'],['cadeaux','Cadeaux','🎁','#f7b2e0'],['autre','Autre','📦','#aeabc2']],
 rev:[['salaire','Salaire','💼','#8ee6c4'],['prime','Prime','✨','#ffe28f'],['aides','Aides','🏛️','#8fcbff'],['rembours','Rembours.','↩️','#b9a8ff'],['vente','Vente','🏷️','#ffb98f'],['interets','Intérêts','📈','#9fe8d0'],['autre','Autre','💰','#aeabc2']]
};
const KINDS={courant:['Compte courant','💳','#8fcbff'],epargne:['Épargne','🐷','#ff9fc8'],placement:['Placement','📈','#8ee6c4']};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=(v,d)=>{const n=Math.round((+v||0)*100)/100;return n.toLocaleString('fr-FR',{minimumFractionDigits:d??(Number.isInteger(n)?0:2),maximumFractionDigits:d===0?0:2})+' €'};
const sgn=v=>(v>0?'+':v<0?'−':'')+eur(Math.abs(v));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=s=>s.slice(0,7);
const addM=(m,k)=>{let[y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)};
const mName=(m,short)=>new Date(m+'-15').toLocaleDateString('fr-FR',short?{month:'short'}:{month:'long',year:'numeric'});
const parseAmt=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(n)?Math.abs(n):0};
const cat=(type,id)=>(CATS[type]||[]).find(c=>c[0]===id)||['autre','Autre','📦','#aeabc2'];

/* ---------- données ---------- */
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!Array.isArray(S.accounts)){S={accounts:[{id:uid(),name:'Compte courant',kind:'courant',start:0},{id:uid(),name:'Livret A',kind:'epargne',start:0}],ops:[],recs:[],budgets:{},hide:false,fresh:true}}
 S.ops=S.ops||[];S.recs=S.recs||[];S.budgets=S.budgets||{};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Mémoire pleine !')}}
const acc=id=>S.accounts.find(a=>a.id===id);
const mainAcc=()=>S.accounts.find(a=>a.kind==='courant')||S.accounts[0];

function flowOn(a,o){ // effet d'une opération sur un compte
 if(o.type==='dep')return o.acc===a.id?-o.amount:0;
 if(o.type==='rev')return o.acc===a.id?o.amount:0;
 if(o.type==='epa')return (o.to===a.id?o.amount:0)-(o.acc===a.id?o.amount:0);
 return 0}
function bal(a,upto){let b=+a.start||0;for(const o of S.ops)if(!upto||o.date<=upto)b+=flowOn(a,o);return b}
function invested(a){return bal(a)} // pour un placement : versements
function value(a){return a.kind==='placement'&&a.value!=null&&a.value!==''?+a.value:bal(a)}
function capital(){return S.accounts.reduce((t,a)=>t+value(a),0)}
function perf(){let inv=0,val=0;for(const a of S.accounts)if(a.kind==='placement'){inv+=invested(a);val+=value(a)}return{inv,val,gain:val-inv,pct:inv>0?(val-inv)/inv*100:0}}
function monthTot(m){const r={dep:0,rev:0,epa:0};for(const o of S.ops)if(ym(o.date)===m)r[o.type]+=o.amount;return r}

/* opérations automatiques */
function applyRecs(){const t=today(),cur=ym(t);let n=0;
 for(const r of S.recs){if(!r.last)r.last=addM(cur,-1);
  let m=addM(r.last,1);
  while(m<=cur){const dmax=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();const d=m+'-'+pad(Math.min(r.day,dmax));
   if(d>t)break;
   S.ops.push({id:uid(),date:d,type:r.type,amount:r.amount,cat:r.cat,note:r.note||'',acc:r.acc||mainAcc()?.id,to:r.to,rec:r.id});n++;r.last=m;m=addM(m,1)}}
 if(n){save();toast(n+' opération'+(n>1?'s':'')+' automatique'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''))}}

/* ---------- graphiques ---------- */
function smooth(P){if(P.length<2)return '';let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);const n=P.length,m=[],dx=[],sl=[];
 for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0]||1e-6;sl[i]=(P[i+1][1]-P[i][1])/dx[i]}
 m[0]=sl[0];m[n-1]=sl[n-2];for(let i=1;i<n-1;i++)m[i]=sl[i-1]*sl[i]<=0?0:(sl[i-1]+sl[i])/2;
 for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=' C'+(P[i][0]+h).toFixed(1)+','+(P[i][1]+m[i]*h).toFixed(1)+' '+(P[i+1][0]-h).toFixed(1)+','+(P[i+1][1]-m[i+1]*h).toFixed(1)+' '+P[i+1][0].toFixed(1)+','+P[i+1][1].toFixed(1)}return d}
function lines(labels,series,h=150){const W=340,H=h,pl=6,pr=6,pt=14,pb=24;
 const all=series.flatMap(s=>s.v);let mx=Math.max(1,...all),mn=Math.min(0,...all);const span=mx-mn||1;
 const X=i=>pl+(W-pl-pr)*(labels.length<2?.5:i/(labels.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/span);
 let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible"><defs>`;
 series.forEach((s,k)=>o+=`<linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".28"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`);
 o+='</defs>';
 for(let g=0;g<3;g++){const y=pt+(H-pt-pb)*g/2;o+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.05)"/>`}
 series.forEach((s,k)=>{const P=s.v.map((v,i)=>[X(i),Y(v)]);const d=smooth(P);if(!d)return;
  if(s.fill)o+=`<path d="${d} L${P[P.length-1][0]},${H-pb} L${P[0][0]},${H-pb} Z" fill="url(#g${k})"/>`;
  o+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linecap="round"/>`;
  const L=P[P.length-1];o+=`<circle cx="${L[0]}" cy="${L[1]}" r="4" fill="${s.c}" stroke="#1c1b27" stroke-width="2"/>`});
 labels.forEach((l,i)=>o+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#7c7992">${l}</text>`);
 return o+'</svg>'}
function donut(items,center,sub){const tot=items.reduce((t,x)=>t+x.v,0),R=46,C=2*Math.PI*R,n=items.filter(x=>x.v>0).length,gap=n>1?9:0;let off=0;
 let o=`<svg viewBox="0 0 120 120" width="160" height="160"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#2a2939" stroke-width="12"/>`;
 if(tot>0)for(const x of items){if(x.v<=0)continue;const len=Math.max(.5,C*x.v/tot-gap);
  o+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${x.c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=C*x.v/tot}
 return o+`<text x="60" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#f4f2fb">${center}</text><text x="60" y="74" text-anchor="middle" font-size="9.5" fill="#aeabc2">${sub}</text></svg>`}

/* ---------- écrans ---------- */
let tab='home',opsMonth=ym(today());
function opRow(o){const c=cat(o.type==='epa'?'dep':o.type,o.cat);let ic=c[2],col=c[3],title=c[1],sub='';
 if(o.type==='epa'){const t=acc(o.to);ic='🐷';col='#ff9fc8';title='Épargne → '+(t?t.name:'?')}
 else sub=acc(o.acc)&&S.accounts.filter(a=>a.kind==='courant').length>1?acc(o.acc).name:'';
 const dt=new Date(o.date+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
 const m=o.type==='rev'?'<span class="m up">+'+eur(o.amount)+'</span>':o.type==='epa'?'<span class="m" style="color:var(--pink)">'+eur(o.amount)+'</span>':'<span class="m">−'+eur(o.amount)+'</span>';
 return `<div class="op" data-op="${o.id}"><div class="ico" style="background:${col}22">${ic}</div><div class="t"><b>${esc(o.note||title)}</b><small>${o.note?esc(title)+' · ':''}${dt}${sub?' · '+esc(sub):''}${o.rec?' · 🔁':''}</small></div>${m}</div>`}
const sorted=()=>[...S.ops].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));

function ops(){const t=monthTot(opsMonth);const list=sorted().filter(o=>ym(o.date)===opsMonth);
 let h=`<div class="mnav"><button class="ib" data-m="-1">‹</button><b>${mName(opsMonth)}</b><button class="ib" data-m="1">›</button></div>
 <div class="pills" style="margin:0 0 14px"><div class="pill"><span class="lbl">Entrées</span><b class="up">${eur(t.rev)}</b></div><div class="pill"><span class="lbl">Sorties</span><b>${eur(t.dep)}</b></div><div class="pill"><span class="lbl">Épargné</span><b style="color:var(--pink)">${eur(t.epa)}</b></div></div>`;
 if(!list.length)return h+'<div class="card"><div class="empty">Rien ce mois-ci.</div></div>';
 let cur='';h+='<div class="card" style="padding-top:6px">';
 for(const o of list){if(o.date!==cur){cur=o.date;h+=`<div class="day">${new Date(o.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`}h+=opRow(o)}
 return h+'</div><p class="sw" style="text-align:center">Touchez une opération pour la modifier.</p>'}

function budget(){const m=opsMonth;const by={};
 for(const o of S.ops)if(o.type==='dep'&&ym(o.date)===m)by[o.cat]=(by[o.cat]||0)+o.amount;
 const tot=Object.values(by).reduce((a,b)=>a+b,0);

 const by={};for(const o of S.ops)if(o.type==='dep'&&ym(o.date)===m)by[o.cat]=(by[o.cat]||0)+o.amount;
 const items=CATS.dep.map(c=>({n:c[1],e:c[2],c:c[3],v:by[c[0]]||0,b:+S.budgets[c[0]]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);

   $('#rsave').onclick=()=>{const amount=parseAmt($('#ra').value);if(!amount)return toast('Indiquez un montant');if(type!=='epa'&&!c)return toast('Choisissez une catégorie');if(type==='epa'&&!$('#rto')?.value)return toast('Ajoutez un compte épargne');
    const day=Math.min(31,Math.max(1,+$('#rd').value||1));
    const n={id:r.id||uid(),type,amount,cat:type==='epa'?'epargne':c,note:$('#rn').value.trim(),day,acc:r.acc||mainAcc()?.id,last:r.last};if(type==='epa')n.to=$('#rto').value;
    if(!ed){const t=today();n.last=day<=+t.slice(8)?ym(t):addM(ym(t),-1)}
    if(ed)S.recs[S.recs.findIndex(x=>x.id===r.id)]=n;else S.recs.push(n);
    save();applyRecs();closeSheet();render();toast(ed?'Modifié ✓':'Programmée ✓ (à partir du prochain '+day+')')};
   if(ed)$('#rdel').onclick=()=>{S.recs=S.recs.filter(x=>x.id!==r.id);save();closeSheet();render()}})};
 draw()}

/* ---------- événements ---------- */
document.querySelectorAll('nav .t').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#add').onclick=()=>opForm();
$('#ov').onclick=closeSheet;
$('#main').addEventListener('click',e=>{const t=e.target.closest('[data-op],[data-acc],[data-rec],[data-m],[data-go],#eye,#newacc,#setb,#newrec,#exp,#imp,#wipe');if(!t)return;
 if(t.id==='eye'){S.hide=!S.hide;save();render()}
 else if(t.id==='newacc')accForm();
 else if(t.id==='setb')budgetForm();
 else if(t.id==='newrec')recForm();
 else if(t.id==='exp')exportData();
 else if(t.id==='imp')$('#impf').click();
 else if(t.id==='wipe')wipe();
 else if(t.dataset.rec)recForm({...S.recs.find(r=>r.id===t.dataset.rec)});
 else if(t.dataset.op)opForm({...S.ops.find(o=>o.id===t.dataset.op)});
 else if(t.dataset.acc)accForm(acc(t.dataset.acc));
 else if(t.dataset.m){opsMonth=addM(opsMonth,+t.dataset.m);render()}
 else if(t.dataset.go)go(t.dataset.go)});
$('#main').addEventListener('change',e=>{if(e.target.id==='impf'&&e.target.files[0])importData(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&$('#sheet').classList.contains('on')){const b=$('#fsave')||$('#asave')||$('#rsave');if(b&&e.target.tagName==='INPUT'){e.preventDefault();b.click()}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyRecs();render()}});

load();applyRecs();render();$('#hdate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
